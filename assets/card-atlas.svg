<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="ATLAS: Overwatch field guide. 54 heroes and 59 maps from a validated data snapshot, with search, filters, shareable URLs and side-by-side comparison, exported as a 125-page static site. Built with Next.js, React, TypeScript, Playwright.">
  <defs>
    
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <clipPath id="frame"><rect width="600" height="400" rx="20"/></clipPath>
    
    
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a6a6a6"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b35"/>
      <stop offset="0.45" stop-color="#ff6b35" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  
  <g clip-path="url(#frame)">
    <rect width="600" height="400" fill="url(#panel)"/>
    
    <circle cx="540" cy="0" r="260" fill="url(#light)"/>
    <rect width="600" height="2" fill="url(#hair)"/>
  </g>
  <rect x="0.5" y="0.5" width="599" height="399" rx="19.5" fill="none" stroke="#232323"/>
  <path d="M20 0.5 H580" stroke="#ffffff" stroke-opacity="0.07"/>

  <text x="36" y="66" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, Menlo, monospace" font-size="15" letter-spacing="1.4" fill="#ff6b35">03</text>
  <text x="68" y="66" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, Menlo, monospace" font-size="15" letter-spacing="1.4" fill="#8c8c8c">/ OVERWATCH FIELD GUIDE</text>
  <g transform="translate(475 45)">
    <rect width="89" height="28" rx="14" fill="#121212" stroke="#2f2f2f"/>
    <text x="44.5" y="19" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, Menlo, monospace" font-size="14" letter-spacing="1.2" fill="#8c8c8c">PRIVATE</text>
  </g>

  <text x="36" y="132" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-1.2" fill="url(#metal)">ATLAS</text>

  <text x="36" y="186" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#8c8c8c">54 heroes and 59 maps from a validated data</text>
  <text x="36" y="217" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#8c8c8c">snapshot, with search, filters, shareable URLs</text>
  <text x="36" y="248" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#8c8c8c">and side-by-side comparison, exported as a</text>
  <text x="36" y="279" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#8c8c8c">125-page static site.</text>

  <g transform="translate(36 326)">
    <rect width="116" height="38" rx="19" fill="#181818" stroke="#2f2f2f"/>
    <image href="data:image/svg+xml;base64," x="14" y="9" width="20" height="20"/>
    <text x="44" y="24.95"  font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#f2f2f2">Next.js</text>
  </g>
  <g transform="translate(160 326)">
    <rect width="99" height="38" rx="19" fill="#181818" stroke="#2f2f2f"/>
    <image href="data:image/svg+xml;base64," x="14" y="9" width="20" height="20"/>
    <text x="44" y="24.95"  font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#f2f2f2">React</text>
  </g>
  <g transform="translate(267 326)">
    <rect width="141" height="38" rx="19" fill="#181818" stroke="#2f2f2f"/>
    <image href="data:image/svg+xml;base64," x="14" y="9" width="20" height="20"/>
    <text x="44" y="24.95"  font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#f2f2f2">TypeScript</text>
  </g>
  <g transform="translate(416 326)">
    <rect width="141" height="38" rx="19" fill="#181818" stroke="#2f2f2f"/>
    <image href="data:image/svg+xml;base64," x="14" y="9" width="20" height="20"/>
    <text x="44" y="24.95"  font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#f2f2f2">Playwright</text>
  </g>
  
</svg>
